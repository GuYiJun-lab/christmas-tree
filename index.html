:root{color-scheme:dark;--scene-scale:1;--scene-x:50vw;--scene-y:50vh;--ink:#edeaff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03020b}
body{font-family:WishSerif,'Songti SC','Noto Serif CJK SC',serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:1px solid #c4caff;outline-offset:5px}
#experience{position:relative;isolation:isolate;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 51% 60%,#0b0d24 0%,#060512 42%,#030209 82%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#atmosphere{z-index:0;pointer-events:none}#particles{z-index:1;pointer-events:none}#details{z-index:2;touch-action:none;cursor:default;outline:none}
.intro{position:absolute;inset:0;z-index:4;width:100%;height:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 12px;transition:opacity 1s ease;cursor:pointer}
.intro.leaving{opacity:0;pointer-events:none}.intro-title{font-size:clamp(16px,calc(16px * var(--scene-scale)),28px);font-weight:600;letter-spacing:.23em;text-indent:.23em;text-shadow:0 0 16px #c8c0fb80;transform:translateY(8px)}
.intro-caption{font-family:WishSerif,serif;color:#b4abc3;opacity:.59;font-size:clamp(10px,calc(8px * var(--scene-scale)),14px);letter-spacing:.22em;margin-top:23px}
.intro-star{position:absolute;top:calc(50% - 30px * var(--scene-scale));left:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#f6eeff;box-shadow:0 0 8px 2px #fff,0 0 24px 8px #d3c3ff60,0 0 65px 22px #9d7dd324;animation:introPulse 3s ease-in-out infinite}
@keyframes introPulse{50%{opacity:.65;box-shadow:0 0 8px 2px #fff,0 0 26px 10px #d3c3ff90,0 0 70px 30px #9d7dd324}}
.controls{position:absolute;z-index:8;top:max(8px,env(safe-area-inset-top));right:max(9px,env(safe-area-inset-right));display:flex;gap:6px;opacity:.47;transition:opacity .25s}.controls:hover,.controls:focus-within{opacity:1}

.greeting{position:absolute;z-index:3;left:var(--scene-x);top:calc(var(--scene-y) + 149px * var(--scene-scale));transform:translateX(-50%);text-align:center;white-space:nowrap;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:opacity .5s}

.christmas-caption{font-size:clamp(9px,calc(8px * var(--scene-scale)),13px);letter-spacing:.23em;color:#c1b6cd;opacity:.62;margin-top:3px}

  <main id="experience" aria-label="星空粒子圣诞树互动动画">
    <canvas id="atmosphere" aria-hidden="true"></canvas>
    <canvas id="particles" aria-hidden="true"></canvas>
    <canvas id="details" aria-label="点击圣诞树绽放星光，点击礼物收下祝福；拖动旋转" tabindex="-1"></canvas>
    <button id="intro" class="intro" aria-label="开始播放：为你点亮一棵圣诞树">
      <span class="intro-star" aria-hidden="true"></span>
      <span class="intro-title">为你点亮一棵圣诞树</span>

    <p id="hint" class="scene-hint">点击礼物收祝福 · 拖动旋转</p>

    <p id="wish-line" class="wish-line" aria-live="polite"></p>

      </button>
      <button id="settings-toggle" class="icon-button" title="设置与重新播放" aria-label="设置与重新播放" aria-expanded="false" aria-controls="settings">

      </button>
    </nav>
    <section id="settings" class="settings" hidden aria-labelledby="settings-title">
      <div class="settings-heading"><h1 id="settings-title">把祝福写进星光</h1><button id="settings-close" aria-label="关闭设置">×</button></div>
      <form id="wish-form">
        <label for="left-wish">左侧祝福</label><input id="left-wish" maxlength="10" value="ll圣诞快乐" autocomplete="off">
        <label for="right-wish">右侧祝福</label><input id="right-wish" maxlength="10" value="天天开心" autocomplete="off">
        <button class="primary-button" type="submit">保存祝福并重新播放</button>
      </form>
      <button id="replay" class="secondary-button">重新播放</button>
      <p>点击礼物收下祝福，拖动星空旋转圣诞树。</p>

  if(t<10.3||burst>.94)return;
  const build=clamp((t-10.3)/2.25),fade=(1-burst)*(1-burst),segments=640;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const secondary of [true,false]){
    let last=ribbonPoint(0,t,secondary);
    for(let j=1;j<=segments*build;j++){
      const u=j/segments,p=ribbonPoint(u,t,secondary);
      const front=(p.z/(8+u*145)+1)/2;
      if(secondary){
        if(j%3===0)renderer.add(p.x,p.y,(1.5+front*1.9)*s,.98,.93,.78,fade*(.25+front*.5));
      }else{
        ctx.strokeStyle=`rgba(224,230,255,${fade*(.1+front*.52)})`;ctx.lineWidth=(.38+front*.6)*s;
        ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
        if(j%2===0)renderer.add(p.x+Math.sin(j*3)*s*.8,p.y,(1+front*2.3)*s,.87,.9,1,fade*(.25+front*.6));
      }
      last=p;
    }
  }
  const head=build<1?build:((t*.095)%1),point=ribbonPoint(head,t);
  const headAlpha=fade*(build<1?1:.7);
  flare(ctx,point.x,point.y,13*s,headAlpha,t);
  const point2=ribbonPoint((head+.47)%1,t);
  if(build>=1)radial(ctx,point2.x,point2.y,10*s,'237,234,255',.55*fade);
  ctx.restore();
}

function drawSparkleStars(t){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of sparkles){
    const twinkle=Math.pow(.5+.5*Math.sin(t*(.45+p.depth)+p.phase),6);
    if(twinkle<.25)continue;
    const x=((p.x*w+Math.sin(t*.05+p.phase)*8*s+state.rotation*7*p.depth)%w+w)%w;
    const y=((p.y*h+t*p.speed*3*s)%(h+12))-6;
    const radius=(2+p.depth*2.8)*s;
    ctx.strokeStyle=`rgba(212,220,255,${twinkle*.28})`;ctx.lineWidth=.45*s;
    ctx.beginPath();ctx.moveTo(x-radius,y);ctx.lineTo(x+radius,y);ctx.moveTo(x,y-radius);ctx.lineTo(x,y+radius);ctx.stroke();
  }
  ctx.restore();
}

let lastCaption='',lastGreeting=-1,lastHint=-1;
function updateText(t,burst){
  let greeting=(t>=13.1&&t<15.85)||(t>23.55);
  greeting=greeting?(1-burst):0;
  const caption=t>=15.9&&t<18.7?'闭上眼睛，许个愿吧':t>=18.7&&t<21.1?'愿望会被星星听见':'';
  if(caption!==lastCaption){$('wish-line').textContent=caption;$('wish-line').style.opacity=caption?'1':'0';lastCaption=caption;}
  const g=Math.round(greeting*30)/30;if(g!==lastGreeting){$('greeting').style.opacity=g;lastGreeting=g;}
  const hint=t>12.9&&burst<.25?.5:0;if(hint!==lastHint){$('hint').style.opacity=hint;lastHint=hint;}
}

function drawFrame(now){
  const ambient=now/1000;
  const t=state.playing?(now-state.start-state.paused)/1000:0;
  state.t=t;state.rotation+=(state.rotationTarget-state.rotation)*.085;
  const burst=state.playing?getBurst(t):0;
  ctx.clearRect(0,0,w,h);
  drawBackground(t,ambient,burst);
  drawSparkleStars(ambient);
  if(state.playing){
    drawRain(t);drawMeteors(t);drawGround(t,burst);drawMainParticles(t,burst);drawHeartBloom(t);drawRibbons(t,burst);
    const topAlpha=smooth((t-12.55)/.5)*(1-burst);
    if(topAlpha>0)flare(ctx,cx,cy-205*s,75*s,topAlpha,t);
    if(t>9.5&&t<10.55)flare(ctx,cx,cy-205*s,35*s,Math.sin(clamp((t-9.5)/1.05)*PI)*.6,t);
    layout.rotation=state.rotation;layout.leftText=state.left;layout.rightText=state.right;
    if(w/h<.9){
      // Keep side wishes inside narrow screens without shrinking the central tree.
      const fs=Math.min(s,w/900),fl={...layout,scale:fs,cy:cy-115*s};
      fireworks.draw(ctx,t,fl);
    }else fireworks.draw(ctx,t,layout);
    if(burst<.3)gifts.draw(ctx,t,{...layout,opacity:1-burst/.3},'front');
    updateText(t,burst);
  }
  renderer.finish();
  requestAnimationFrame(drawFrame);
}

let audioRequest = 0;
let soundChosen = false;
function setSound(on) {
  const request = ++audioRequest;
  state.sound = on;
  syncSound();
  if (!on || document.hidden) {
    audio.pause();
    return;
  }
  audio.play().catch(() => {
    if (request !== audioRequest || document.hidden) return;
    state.sound = false;
    syncSound();
    toast('轻触音乐按钮，打开声音');
  });
}
function toggleSound() {
  soundChosen = true;
  setSound(!state.sound);
}
function syncSound(){$('sound').setAttribute('aria-pressed',String(state.sound));$('sound').setAttribute('aria-label',state.sound?'关闭音乐':'打开音乐');$('sound').title=state.sound?'关闭音乐':'打开音乐';}
function begin(withAudio=true){
  state.playing=true;state.start=performance.now();state.t=0;state.paused=0;state.manualBurst=-100;state.rotation=0;state.rotationTarget=0;
  gifts.reset();fireworks.reset();lastCaption='';$('wish-line').textContent='';$('wish-line').style.opacity=0;
  closeSettings();
  surface.tabIndex = 0;
  surface.focus({preventScroll:true});
  $('intro').classList.add('leaving');$('intro').setAttribute('aria-hidden','true');$('intro').tabIndex=-1;
  audio.currentTime=1.1;
  setSound(withAudio);
}
$('intro').addEventListener('click',()=>begin(soundChosen ? state.sound : true));
$('sound').addEventListener('click',toggleSound);
let toastTimer;
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3500);}
async function fullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('横屏浏览，星光会更完整');}
  catch{toast('当前窗口不支持全屏，可以横屏观看');}
}
$('fullscreen').addEventListener('click',fullscreen);
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;$('fullscreen').title=active?'退出全屏':'全屏';$('fullscreen').setAttribute('aria-label',active?'退出全屏':'全屏');});
function closeSettings() {
  if ($('settings').hidden) return;
  const restoreFocus = $('settings').contains(document.activeElement);
  $('settings').hidden = true;
  $('settings-toggle').setAttribute('aria-expanded', 'false');
  if (restoreFocus) $('settings-toggle').focus({preventScroll:true});
}
$('settings-toggle').addEventListener('click',()=>{const open=$('settings').hidden;$('settings').hidden=!open;$('settings-toggle').setAttribute('aria-expanded',String(open));if(open)$('left-wish').focus();});
$('settings-close').addEventListener('click',closeSettings);
$('replay').addEventListener('click',()=>begin(state.sound));
$('wish-form').addEventListener('submit',e=>{
  e.preventDefault();state.left=$('left-wish').value.trim()||'ll圣诞快乐';state.right=$('right-wish').value.trim()||'天天开心';
  $('left-wish').value=state.left;$('right-wish').value=state.right;
  fireworks.setText(state.left,state.right);
  try{localStorage.setItem('starlight-wishes',JSON.stringify({left:state.left,right:state.right}));}catch{}
  begin(state.sound);
});
let pointer=null;
surface.addEventListener('pointerdown',e=>{
  if(!e.isPrimary || e.button!==0 || pointer)return;
  if(!state.playing){begin(soundChosen ? state.sound : true);return;}
  closeSettings();pointer={id:e.pointerId,x:e.clientX,y:e.clientY,last:e.clientX,moved:false};surface.setPointerCapture(e.pointerId);
});
surface.addEventListener('pointermove',e=>{
  if(pointer && e.pointerId!==pointer.id)return;
  if(pointer){if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved){state.rotationTarget+=(e.clientX-pointer.last)*.008;state.dragging=true;}pointer.last=e.clientX;}
  else surface.style.cursor=state.t>12.5?'grab':'default';
});
const wishes=['愿你平安喜乐，万事胜意','愿每一个梦想，都有回响','愿所有美好，如期而至','愿你被温柔的光照亮','愿你所遇皆暖，所想皆成'];
surface.addEventListener('pointerup',e=>{
  if(!pointer || e.pointerId!==pointer.id)return;const clicked=!pointer.moved && Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)<=5;pointer=null;state.dragging=false;
  if(!clicked||state.t<12.7)return;
  const giftIndex=gifts.hitTest(e.clientX,e.clientY);
  if(giftIndex>=0&&getBurst(state.t)<.3){gifts.open(giftIndex);toast(wishes[giftIndex]);fireworks.burst(e.clientX,e.clientY-45*s,state.t,giftIndex%2?'gold':'rose');}
  else if(Math.abs(e.clientX-cx)<170*s&&e.clientY>cy-245*s&&e.clientY<cy+140*s){if(getBurst(state.t)<.03)state.manualBurst=state.t;}
  else fireworks.burst(e.clientX,e.clientY,state.t,'gold');
});
function cancelPointer(e) {
  if (pointer && pointer.id === e.pointerId) {
    pointer = null;
    state.dragging = false;
  }
}
surface.addEventListener('pointercancel', cancelPointer);
surface.addEventListener('lostpointercapture', cancelPointer);
addEventListener('keydown',e=>{
  if(e.isComposing || e.ctrlKey || e.metaKey || e.altKey)return;
  if(e.key==='Escape' && !$('settings').hidden){closeSettings();return;}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable)return;
  if(e.code==='Space' && e.target.closest('button'))return;
  if(e.code==='Space'){e.preventDefault();if(!state.playing)begin(soundChosen ? state.sound : true);else if(state.t>12.7)state.manualBurst=state.t;}
  if(e.key.toLowerCase()==='r')begin(state.sound);
  if(e.key.toLowerCase()==='m')toggleSound();
  if(e.key.toLowerCase()==='f')fullscreen();
  if(e.key==='ArrowLeft')state.rotationTarget-=.2;
  if(e.key==='ArrowRight')state.rotationTarget+=.2;
  if(e.key==='Enter'&&e.target===surface&&state.t>12.7)state.manualBurst=state.t;
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){state.hiddenAt=performance.now();if(state.sound){++audioRequest;audio.pause();}}
  else{if(state.hiddenAt){if(state.playing)state.paused+=performance.now()-state.hiddenAt;state.hiddenAt=0;}if(state.sound)setSound(true);}
});
document.fonts?.ready.then(()=>fireworks.textCache.clear());
requestAnimationFrame(drawFrame);

})();

</script>
</body>
</html>
